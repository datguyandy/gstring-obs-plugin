name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag / version (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Resolve version
        id: meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$') {
            throw "Invalid release tag: $tag"
          }
          $ver = $tag.TrimStart("v")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build release DLL
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release, dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\gstring_captions.dll target\release\gstring_captions.dll
          New-Item -ItemType Directory -Force staging\gstring-captions\bin\64bit | Out-Null
          Copy-Item target\release\gstring_captions.dll staging\gstring-captions\bin\64bit\gstring-captions.dll
          Compress-Archive -Path staging\gstring-captions -DestinationPath dist\gstring-captions-windows-x64.zip -Force
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        env:
          PLUGIN_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not $iscc) {
            choco install innosetup --version=6.4.3 -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DPluginVersion=$env:PLUGIN_VERSION" packaging\windows\installer.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            dist/gstring-captions-windows-x64-setup.exe
            dist/gstring-captions-windows-x64.zip

  build-macos:
    name: Build macOS (Universal)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Resolve version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_VERSION:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build universal dylib
        env:
          PLUGIN_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist "staging/gstring-captions.plugin/Contents/MacOS"
          lipo -create \
            target/aarch64-apple-darwin/release/libgstring_captions.dylib \
            target/x86_64-apple-darwin/release/libgstring_captions.dylib \
            -output "staging/gstring-captions.plugin/Contents/MacOS/gstring-captions"
          sed "s/__VERSION__/${PLUGIN_VERSION}/g" packaging/macos/Info.plist \
            > "staging/gstring-captions.plugin/Contents/Info.plist"
          (cd staging && zip -r ../dist/gstring-captions-macos-universal.zip gstring-captions.plugin)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-universal
          path: dist/gstring-captions-macos-universal.zip

  build-linux:
    name: Build Linux (x64)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build release .so
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          mkdir -p dist staging/gstring-captions/bin/64bit
          cp target/x86_64-unknown-linux-gnu/release/libgstring_captions.so \
             staging/gstring-captions/bin/64bit/gstring-captions.so
          tar -czf dist/gstring-captions-linux-x64.tar.gz -C staging gstring-captions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64
          path: dist/gstring-captions-linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/gstring-captions-windows-x64-setup.exe
            artifacts/gstring-captions-windows-x64.zip
            artifacts/gstring-captions-macos-universal.zip
            artifacts/gstring-captions-linux-x64.tar.gz
      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: GString Captions OBS Plugin ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
