[package]
name = "gstring-captions-obs"
version = "0.1.1"
edition = "2024"
publish = false
description = "Native OBS Studio audio filter plugin for GString live captions"

# Standalone workspace so the OBS C-ABI crate stays isolated from the bot
# workspace's `unsafe_code = "forbid"` lint and Railway container builds.
[workspace]

[lib]
name = "gstring_captions"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
